name: Verify web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Run the optional live RuStore smoke test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check static files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f api-patch.js
          test -f LICENSE
          test -f NOTICE
          node --check api-patch.js
          node --check worker/worker.js
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          test ! -e script.js
          test ! -e styles.css
          forbidden=$(printf '\x72\x75\x2e\x6d\x73\x70\x2e\x72\x66\x2e\x61\x70\x70')
          if grep -RFn --exclude-dir=.git -- "$forbidden" .; then
            exit 1
          fi

      - name: Test RuStore browser transport
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          function createStorage() {
            const values = new Map();
            return {
              getItem: key => values.has(key) ? values.get(key) : null,
              setItem: (key, value) => values.set(key, String(value)),
              removeItem: key => values.delete(key)
            };
          }

          const prefix = 'https://test.cors.workers.dev/?';
          const calls = [];
          const mockFetch = async (input, init = {}) => {
            const url = String(input);
            calls.push({ url, init });
            const target = url.startsWith(prefix) ? url.slice(prefix.length) : url;

            if (target.endsWith('/rustore-info/new-version')) {
              return new Response(JSON.stringify({
                code: 'OK',
                body: { latestVersion: 110802 }
              }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            if (target.includes('/applicationData/apps?')) {
              return new Response(JSON.stringify({
                code: 'OK',
                body: {
                  content: [{ appId: 1, packageName: 'com.vkontakte.android' }],
                  totalElements: 1,
                  totalPages: 1
                }
              }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            if (target.endsWith('/applicationData/v2/download-link')) {
              return new Response(JSON.stringify({
                code: 'OK',
                body: { downloadUrls: [{ url: 'https://static.rustore.ru/example.apk' }] }
              }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            throw new Error(`Unexpected URL: ${url}`);
          };

          const window = {
            location: { href: 'https://basil-as.github.io/rustore-downloader/' },
            fetch: mockFetch
          };

          const context = vm.createContext({
            window,
            fetch: mockFetch,
            sessionStorage: createStorage(),
            localStorage: createStorage(),
            URL,
            URLSearchParams,
            Headers,
            Request,
            Response,
            AbortController,
            AbortSignal,
            setTimeout,
            clearTimeout,
            console,
            Date,
            JSON
          });

          vm.runInContext(fs.readFileSync('api-patch.js', 'utf8'), context, { filename: 'api-patch.js' });

          const search = await window.RuStoreApi.search('VK');
          assert.equal(search.code, 'OK');
          assert.equal(calls.length, 2);
          assert.ok(calls[0].url.startsWith(prefix + 'https://backapi.rustore.ru/rustore-info/new-version'));
          assert.equal(new Headers(calls[0].init.headers).get('ruStoreVerCode'), '110802');
          assert.ok(calls[1].url.startsWith(prefix + 'https://backapi.rustore.ru/applicationData/apps?'));
          assert.ok(calls[1].url.includes('query=VK'));
          assert.equal(new Headers(calls[1].init.headers).get('ruStoreVerCode'), '110802');

          const download = await window.RuStoreApi.downloadV2(1);
          assert.equal(download.code, 'OK');
          assert.equal(calls.length, 3);
          assert.ok(calls[2].url.startsWith(prefix + 'https://backapi.rustore.ru/applicationData/v2/download-link'));
          const headers = new Headers(calls[2].init.headers);
          assert.equal(headers.get('ruStoreVerCode'), '110802');
          assert.match(headers.get('Content-Type') || '', /^application\/json/);
          assert.equal(calls[2].init.method, 'POST');
          assert.match(String(calls[2].init.body), /"withoutSplits":false/);

          console.log('RuStore browser transport: OK');
          NODE

  live-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Optional live RuStore request
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const target = 'https://backapi.rustore.ru/applicationData/overallInfo/com.vkontakte.android';
          const response = await fetch(`https://test.cors.workers.dev/?${target}`, {
            headers: {
              Accept: 'application/json',
              ruStoreVerCode: '110802'
            },
            signal: AbortSignal.timeout(25_000)
          });

          const text = await response.text();
          assert.equal(response.ok, true, `HTTP ${response.status}: ${text.slice(0, 300)}`);
          const data = JSON.parse(text);
          assert.equal(data.code, 'OK');
          assert.ok(data.body?.appId, 'appId is missing');
          console.log(`Live RuStore response: ${data.body.appName}`);
          NODE
