name: Verify web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check static files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f api-patch.js
          test -f vercel.json
          test -f worker/worker.js
          test -f LICENSE
          test -f NOTICE
          node --check api-patch.js
          node --check worker/worker.js
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          test ! -e script.js
          test ! -e styles.css
          test ! -e proxy-fallback.js
          forbidden=$(printf '\x72\x75\x2e\x6d\x73\x70\x2e\x72\x66\x2e\x61\x70\x70')
          if grep -RFn --exclude-dir=.git -- "$forbidden" .; then
            exit 1
          fi

      - name: Test Vercel same-origin RuStore transport
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          function createStorage() {
            const values = new Map();
            return {
              getItem: key => values.has(key) ? values.get(key) : null,
              setItem: (key, value) => values.set(key, String(value)),
              removeItem: key => values.delete(key)
            };
          }

          const calls = [];
          const mockFetch = async (input, init = {}) => {
            const url = String(input);
            calls.push({ url, init });

            if (url === '/api/rustore-info/new-version') {
              return new Response(JSON.stringify({ code: 'OK', body: { latestVersion: 110802 } }), {
                status: 200,
                headers: { 'Content-Type': 'application/json' }
              });
            }

            if (url.startsWith('/api/applicationData/apps?')) {
              return new Response(JSON.stringify({
                code: 'OK',
                body: { content: [{ appId: 1, packageName: 'com.vkontakte.android' }], totalElements: 1, totalPages: 1 }
              }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            if (url === '/api/applicationData/v2/download-link') {
              return new Response(JSON.stringify({
                code: 'OK',
                body: { downloadUrls: [{ url: 'https://static.rustore.ru/example.apk' }] }
              }), { status: 200, headers: { 'Content-Type': 'application/json' } });
            }

            throw new Error(`Unexpected URL: ${url}`);
          };

          const window = {
            location: {
              href: 'https://rustore-downloader.vercel.app/',
              hostname: 'rustore-downloader.vercel.app'
            },
            fetch: mockFetch
          };

          const context = vm.createContext({
            window,
            fetch: mockFetch,
            sessionStorage: createStorage(),
            localStorage: createStorage(),
            URL,
            URLSearchParams,
            Headers,
            Request,
            Response,
            AbortController,
            AbortSignal,
            setTimeout,
            clearTimeout,
            console,
            Date,
            JSON
          });

          vm.runInContext(fs.readFileSync('api-patch.js', 'utf8'), context, { filename: 'api-patch.js' });
          assert.equal(window.RuStoreApi.getTransportMode(), 'same-origin');
          assert.equal(window.RuStoreApi.isConfigured(), true);

          const search = await window.RuStoreApi.search('VK');
          assert.equal(search.code, 'OK');
          assert.equal(calls.length, 2);
          assert.equal(calls[0].url, '/api/rustore-info/new-version');
          assert.match(calls[1].url, /^\/api\/applicationData\/apps\?/);
          assert.ok(calls[1].url.includes('query=VK'));
          assert.equal(new Headers(calls[1].init.headers).get('ruStoreVerCode'), '110802');

          const download = await window.RuStoreApi.downloadV2(1);
          assert.equal(download.code, 'OK');
          assert.equal(calls[2].url, '/api/applicationData/v2/download-link');
          assert.equal(new Headers(calls[2].init.headers).get('ruStoreVerCode'), '110802');
          assert.equal(calls[2].init.method, 'POST');
          assert.match(String(calls[2].init.body), /"withoutSplits":false/);

          console.log('Vercel same-origin transport: OK');
          NODE

      - name: Test unconfigured static host fails clearly
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const storage = { getItem: () => null, setItem: () => {}, removeItem: () => {} };
          const window = {
            location: { href: 'https://basil-as.github.io/rustore-downloader/', hostname: 'basil-as.github.io' },
            fetch: async () => { throw new Error('fetch must not be called without transport'); }
          };
          const context = vm.createContext({
            window,
            fetch: window.fetch,
            sessionStorage: storage,
            localStorage: storage,
            URL,
            URLSearchParams,
            Headers,
            Request,
            Response,
            AbortController,
            AbortSignal,
            setTimeout,
            clearTimeout,
            console,
            Date,
            JSON
          });

          vm.runInContext(fs.readFileSync('api-patch.js', 'utf8'), context, { filename: 'api-patch.js' });
          assert.equal(window.RuStoreApi.getTransportMode(), 'unconfigured');
          assert.equal(window.RuStoreApi.isConfigured(), false);
          await assert.rejects(
            () => window.RuStoreApi.info('com.vkontakte.android'),
            /нужен серверный транспорт/
          );
          console.log('Unconfigured static host error: OK');
          NODE
