name: Verify web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check project and build
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f api-patch.js
          test -f worker/site-worker.js
          test -f wrangler.jsonc
          test -f scripts/build.mjs
          test -f LICENSE
          test -f NOTICE
          node --check api-patch.js
          cp worker/site-worker.js /tmp/site-worker.mjs
          node --check /tmp/site-worker.mjs
          find js -name '*.js' -print0 | xargs -0 -n1 node --check
          npm run build
          test -f dist/index.html
          test -f dist/api-patch.js
          test ! -e proxy-fallback.js
          forbidden=$(printf '\x72\x75\x2e\x6d\x73\x70\x2e\x72\x66\x2e\x61\x70\x70')
          if grep -RFn --exclude-dir=.git -- "$forbidden" .; then
            exit 1
          fi

      - name: Test Worker API and GitHub Pages CORS
        shell: bash
        run: |
          cp worker/site-worker.js /tmp/site-worker.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { pathToFileURL } from 'node:url';

          const worker = (await import(`${pathToFileURL('/tmp/site-worker.mjs').href}?t=${Date.now()}`)).default;
          const upstreamCalls = [];
          globalThis.fetch = async (input, init = {}) => {
            const url = String(input);
            upstreamCalls.push({ url, init });
            if (url.includes('/applicationData/apps?')) {
              return Response.json({ code: 'OK', body: { content: [] } });
            }
            throw new Error(`Unexpected upstream: ${url}`);
          };

          const env = { ASSETS: { fetch: async () => new Response('asset') } };
          const origin = 'https://basil-as.github.io';

          const preflight = await worker.fetch(new Request(
            'https://rustore-downloader.basil-as.workers.dev/api/applicationData/apps',
            {
              method: 'OPTIONS',
              headers: {
                Origin: origin,
                'Access-Control-Request-Method': 'GET',
                'Access-Control-Request-Headers': 'rustorevercode'
              }
            }
          ), env);
          assert.equal(preflight.status, 204);
          assert.equal(preflight.headers.get('Access-Control-Allow-Origin'), origin);

          const response = await worker.fetch(new Request(
            'https://rustore-downloader.basil-as.workers.dev/api/applicationData/apps?pageNumber=0&pageSize=18&query=VK',
            { headers: { Origin: origin, ruStoreVerCode: '110802', Accept: 'application/json' } }
          ), env);
          assert.equal(response.status, 200);
          assert.equal(response.headers.get('Access-Control-Allow-Origin'), origin);
          assert.equal((await response.json()).code, 'OK');
          assert.equal(upstreamCalls.length, 1);
          assert.match(upstreamCalls[0].url, /^https:\/\/backapi\.rustore\.ru\/applicationData\/apps\?/);
          assert.equal(new Headers(upstreamCalls[0].init.headers).get('ruStoreVerCode'), '110802');

          const blocked = await worker.fetch(new Request(
            'https://rustore-downloader.basil-as.workers.dev/api/applicationData/apps',
            { headers: { Origin: 'https://evil.example' } }
          ), env);
          assert.equal(blocked.status, 403);
          console.log('Worker CORS/API: OK');
          NODE

      - name: Test GitHub Pages frontend through Cloudflare
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          function storage() {
            const values = new Map();
            return {
              getItem: key => values.has(key) ? values.get(key) : null,
              setItem: (key, value) => values.set(key, String(value)),
              removeItem: key => values.delete(key)
            };
          }

          const base = 'https://rustore-downloader.basil-as.workers.dev';
          const calls = [];
          const mockFetch = async (input, init = {}) => {
            const url = String(input);
            calls.push({ url, init });
            if (url === `${base}/api/rustore-info/new-version`) {
              return Response.json({ code: 'OK', body: { latestVersion: 110802 } });
            }
            if (url.startsWith(`${base}/api/applicationData/apps?`)) {
              return Response.json({ code: 'OK', body: { content: [], totalElements: 0, totalPages: 0 } });
            }
            throw new Error(`Unexpected URL: ${url}`);
          };

          const window = {
            location: { href: 'https://basil-as.github.io/rustore-downloader/', hostname: 'basil-as.github.io' },
            fetch: mockFetch
          };
          const context = vm.createContext({
            window,
            fetch: mockFetch,
            sessionStorage: storage(),
            localStorage: storage(),
            URL, URLSearchParams, Headers, Request, Response,
            AbortController, AbortSignal, setTimeout, clearTimeout,
            console, Date, JSON
          });

          vm.runInContext(fs.readFileSync('api-patch.js', 'utf8'), context, { filename: 'api-patch.js' });
          assert.equal(window.RuStoreApi.getTransportMode(), 'github-pages-via-cloudflare');
          assert.equal(window.RuStoreApi.isConfigured(), true);
          const result = await window.RuStoreApi.search('VK');
          assert.equal(result.code, 'OK');
          assert.equal(calls[0].url, `${base}/api/rustore-info/new-version`);
          assert.match(calls[1].url, /^https:\/\/rustore-downloader\.basil-as\.workers\.dev\/api\/applicationData\/apps\?/);
          assert.equal(new Headers(calls[1].init.headers).get('ruStoreVerCode'), '110802');
          console.log('GitHub Pages -> Cloudflare: OK');
          NODE

      - name: Test unknown static host fails clearly
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';

          const storage = { getItem: () => null, setItem: () => {}, removeItem: () => {} };
          const window = {
            location: { href: 'https://example.invalid/', hostname: 'example.invalid' },
            fetch: async () => { throw new Error('fetch must not be called without transport'); }
          };
          const context = vm.createContext({
            window,
            fetch: window.fetch,
            sessionStorage: storage,
            localStorage: storage,
            URL, URLSearchParams, Headers, Request, Response,
            AbortController, AbortSignal, setTimeout, clearTimeout,
            console, Date, JSON
          });
          vm.runInContext(fs.readFileSync('api-patch.js', 'utf8'), context, { filename: 'api-patch.js' });
          assert.equal(window.RuStoreApi.getTransportMode(), 'unconfigured');
          assert.equal(window.RuStoreApi.isConfigured(), false);
          await assert.rejects(() => window.RuStoreApi.info('com.vkontakte.android'), /нужен серверный транспорт/);
          console.log('Unknown static host error: OK');
          NODE
