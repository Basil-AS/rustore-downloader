name: Live RuStore canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check live RuStore through Pages transport
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const target = 'https://backapi.rustore.ru/applicationData/overallInfo/com.vkontakte.android';
          const response = await fetch(`https://test.cors.workers.dev/?${target}`, {
            headers: {
              Accept: 'application/json',
              ruStoreVerCode: '110802'
            },
            signal: AbortSignal.timeout(25_000)
          });

          const text = await response.text();
          assert.equal(response.ok, true, `HTTP ${response.status}: ${text.slice(0, 300)}`);
          const data = JSON.parse(text);
          assert.equal(data.code, 'OK');
          assert.ok(data.body?.appId, 'appId is missing');
          assert.equal(data.body?.packageName, 'com.vkontakte.android');
          console.log(`Live RuStore OK: ${data.body.appName}`);
          NODE
